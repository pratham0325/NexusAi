# NexusAI — full stack: MongoDB + Express backend + React frontend
#
#   docker compose up --build
#
# Frontend  → http://localhost:8787
# Backend   → http://localhost:5000  (health: /health)
# MongoDB   → mongodb://mongo:27017/nexusai
#
# Add OPENAI_API_KEY / GOOGLE_AI_API_KEY / GROQ_API_KEY to .env for real
# completions; without keys the built-in Nexus Demo model serves every feature.
#
# This runs everything on one host with a single Nginx entrypoint. Put HTTPS
# in front of port 8787 (a host proxy or load balancer) for public use, and
# back up the mongo-data volume. MongoDB is not exposed outside the network.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      NODE_ENV: production
      ENABLE_DEV_OTP: "false"
      MONGODB_URI: mongodb://mongo:27017/nexusai
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the deployment environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the deployment environment}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in the deployment environment}
      # Frontend and API share one origin behind Nginx, so Lax cookies suffice.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUST_PROXY: "1"
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-2048}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_AI_BASE_URL: ${GOOGLE_AI_BASE_URL:-https://generativelanguage.googleapis.com}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-qwen/qwen3.8-27b}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OTP_FROM_EMAIL: ${OTP_FROM_EMAIL:-onboarding@resend.dev}
      VLY_INTEGRATION_KEY: ${VLY_INTEGRATION_KEY:-}
      VLY_INTEGRATION_BASE_URL: ${VLY_INTEGRATION_BASE_URL:-https://integrations.freebuff.com}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8787:8787"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
